config-version = 2

start-at-login = false
auto-reload-config = true
enable-projects = false
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
folder-padding = 30

window-tabs.enabled = false
window-tabs.height = 36

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false
auto-add-new-windows-to-folder = false
shortcuts-preset = 'none'
persistent-tabs = []
on-mode-changed = []

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 8
    inner.vertical = 8
    outer.left = 8
    outer.bottom = 8
    outer.top = 8
    outer.right = 8

[workspace-sidebar]
    enabled = true
    collapsed-width = 44
    width = 212
    # Omit monitor to show an independent sidebar on every display.
    # Legacy monitor = 'main' is also treated as all displays for this sidebar.
    # Use monitor = 1, 'secondary', 2, or a list to restrict it.
    menu-bar-reserve-height = 28
    folder-deletion-action = 'close-windows'
    widgets = [
        { id = 'time-date', type = 'built-in/time-date', enabled = false, show-date = true },
        { id = 'toggl-week-focus', type = 'built-in/toggl-week-focus', enabled = false, entries-path = '/Users/side/Documents/now/self/self_data/data', target-date = '2026-09-13' },
        { id = 'toggl-weekly-focus', type = 'built-in/toggl-weekly-focus', enabled = false, entries-path = '/Users/side/Documents/now/self/self_data/data', target-date = '2026-09-13' },
    ]

[mode.main.binding]
    ctrl-tab = []
    ctrl-shift-tab = []
    ctrl-f = 'open-sidebar'
    alt-space = 'layout horizontal vertical'
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'
    alt-n = 'new-tab'
    alt-p = 'focus dfs-prev'
    alt-tab = 'tab next'
    alt-shift-tab = 'tab prev'
    alt-0 = 'tab 10'
    alt-1 = 'tab 1'
    alt-2 = 'tab 2'
    alt-3 = 'tab 3'
    alt-4 = 'tab 4'
    alt-5 = 'tab 5'
    alt-6 = 'tab 6'
    alt-7 = 'tab 7'
    alt-8 = 'tab 8'
    alt-9 = 'tab 9'
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'
    alt-shift-t = 'layout floating tiling'
    alt-shift-m = 'fullscreen'
    cmd-shift-h = 'join-with left'
    cmd-shift-j = 'join-with down'
    cmd-shift-k = 'join-with up'
    cmd-shift-l = 'join-with right'
    cmd-shift-i = 'balance-sizes'
    alt-cmd-j = 'swap down'
    alt-cmd-k = 'swap up'
    ctrl-0 = 'tab 10'
    ctrl-1 = 'tab 1'
    ctrl-2 = 'tab 2'
    ctrl-3 = 'tab 3'
    ctrl-4 = 'tab 4'
    ctrl-5 = 'tab 5'
    ctrl-6 = 'tab 6'
    ctrl-7 = 'tab 7'
    ctrl-8 = 'tab 8'
    ctrl-9 = 'tab 9'
    ctrl-q = 'tab 11'
    ctrl-w = 'tab 12'
    ctrl-e = 'tab 13'
    ctrl-r = 'tab 14'
    ctrl-t = 'tab 15'
    ctrl-h = 'tab prev'
    ctrl-l = 'tab next'
    cmd-ctrl-h = 'tab prev'
    cmd-ctrl-l = 'tab next'
    alt-shift-1 = 'move-node-to-tab 1'
    alt-shift-2 = 'move-node-to-tab 2'
    alt-shift-3 = 'move-node-to-tab 3'
    alt-shift-4 = 'move-node-to-tab 4'
    alt-shift-5 = 'move-node-to-tab 5'
    alt-shift-6 = 'move-node-to-tab 6'
    alt-shift-7 = 'move-node-to-tab 7'
    alt-shift-8 = 'move-node-to-tab 8'
    alt-shift-9 = 'move-node-to-tab 9'
    ctrl-shift-0 = 'move-node-to-tab 10'
    ctrl-shift-h = 'move-node-to-tab --focus-follows-window prev'
    ctrl-shift-l = 'move-node-to-tab --focus-follows-window next'
